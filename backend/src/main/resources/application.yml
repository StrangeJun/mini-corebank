spring:
  application:
    name: corebank
  datasource:
    url: jdbc:postgresql://localhost:5432/corebank
    username: corebank
    password: corebank
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

corebank:
  jwt:
    # 로컬 개발용 기본값. 운영에서는 반드시 JWT_SECRET(Base64, 32바이트 이상)으로 주입한다.
    secret: ${JWT_SECRET:EbWOaMuPtQEWQt3NhvkxI5k4r54pGxGKkLTx6AYpxAksOj5YbbSiyIBkxcb+kVNq}
    access-token-validity: 1h
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  seed:
    admin-email: admin@corebank.com
    # 데모용 기본 관리자 비밀번호. 운영에서는 ADMIN_INITIAL_PASSWORD 로 주입한다.
    admin-password: ${ADMIN_INITIAL_PASSWORD:Admin1234!}
    admin-name: 시스템관리자
